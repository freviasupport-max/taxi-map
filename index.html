<style>
:root{--ink:#1d1c19;--paper:#fff;--muted:#6b6860;--line:#e2dfd6;--lamp:#f2b705;
 --font:"Hiragino Sans","Noto Sans JP","BIZ UDPGothic",system-ui,sans-serif}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:#eee}
#map{position:fixed;inset:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* 上部バー */
.top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(8px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;gap:6px}
#q{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border:0;border-radius:12px;background:var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:12px;padding:0 14px;background:var(--ink);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;border:0;background:var(--paper);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.15);cursor:pointer;display:flex;gap:4px;align-items:center}
.chip[aria-pressed="false"]{opacity:.45}
#results{background:var(--paper);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-height:45vh;overflow:auto}
#results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
#results small{color:var(--muted)}
/* ピン */
.pin{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lb{margin-top:2px;font-size:12.5px;font-weight:800;color:#111;white-space:nowrap;letter-spacing:.01em;
 text-shadow:0 0 2px #fff,0 0 2px #fff,1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,0 1px 0 #fff,0 -1px 0 #fff;display:none}
#map.labels .lb{display:block}
.pin.hl .ic{transform:scale(1.35);outline:3px solid var(--lamp)}
/* 下部シート */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2);padding:14px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.sh{display:flex;align-items:flex-start;gap:10px}
.sheet.min>*:not(.sh){display:none!important}
.sheet.min{max-height:none!important;overflow:visible!important}
.sheet.min .sh h2{font-size:16px}
.sh h2{margin:0;font-size:19px;line-height:1.35;flex:1}
.meta{font-size:13px;color:var(--muted);line-height:1.6}
.x{border:0;background:var(--line);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;flex:none}
.go{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:800;font-size:17px;padding:14px;border-radius:12px;background:var(--lamp);color:var(--ink)}
.alt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.alt a,.alt button{font:inherit;font-size:13px;font-weight:700;text-align:center;text-decoration:none;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.near{display:flex;flex-direction:column}
.near button{display:flex;justify-content:space-between;gap:10px;font:inherit;text-align:left;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.near b{font-variant-numeric:tabular-nums}
.route{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.route .sum{font-weight:800;font-size:15px}
.route ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 2px;align-items:center}
.route li{background:#fff7d6;border:1px solid #f2d36b;border-radius:8px;padding:2px 8px;font-weight:700}
.route li small{font-weight:400;color:var(--muted);margin-left:4px}
.route .arr{color:var(--muted)}
.rc{border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;background:var(--paper);font:inherit;color:var(--ink)}
.rc.on{border-color:#7c3aed;background:#f6f0ff}
.rc .ttl{font-weight:800;font-size:14px}
.rc .grp{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em;margin-top:6px}
.rc .hw{font-size:13px;line-height:1.7}
.rc .hw b{display:inline-block;border-radius:6px;padding:0 6px;color:#fff;font-size:12px;margin-right:4px}
.rc .hw .in{background:#16a34a}.rc .hw .out{background:#dc2626}
.rc .toll{font-weight:800}
.grp{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.rc .rd{font-size:15px;font-weight:700;line-height:1.7}
.route .note{font-size:11px;color:var(--muted)}
.rbtn{font:inherit;font-weight:700;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:9;max-width:600px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.6}
[hidden]{display:none!important}

html.night body{background:#111827}
html.night .go{color:#1d1c19}
html.night .btn{background:#f2b705;color:#1d1c19}
.note{font-size:11px;color:var(--muted);line-height:1.6}
.hoverpop .maplibregl-popup-content{font-family:var(--font);font-size:13px;line-height:1.55;padding:8px 11px;border-radius:9px;color:#111827;box-shadow:0 3px 14px rgba(0,0,0,.25);pointer-events:none}
.hoverpop .maplibregl-popup-tip{display:none}
.hoverpop b{font-size:14px}
html.night .hoverpop .maplibregl-popup-content{background:#1f2937;color:#f3f4f6}
input[type="checkbox"]{flex:none;width:20px;height:20px}
html.night .chip[style*="background"]{color:#1d1c19}
html.night .rc.on{background:#2e1065;border-color:#a78bfa}
html.night .x{background:#374151;color:#f3f4f6}
html.night input,html.night select{background:#111827;color:#f3f4f6;border-color:#374151}
html.night .toast{background:#f3f4f6;color:#111827}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{font:inherit;font-size:13px;font-weight:700;padding:9px 2px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.zone{font-size:13px;font-weight:700;border-radius:8px;padding:6px 10px;line-height:1.5}
.zone.ok{background:rgba(22,163,74,.12);color:#15803d}
.zone.warn{background:rgba(220,38,38,.12);color:#b91c1c}
.fare{font-size:13px;font-weight:700}
.maplibregl-ctrl-top-right{top:calc(108px + env(safe-area-inset-top))}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
</style>
</head>

const aUrl = p => "https://maps.apple.com/?dirflg=d&daddr="+encodeURIComponent(dest(p));

const yUrl = p => "yjcarnavi://navi/select?lat="+p.lat+"&lon="+p.lng+"&name="+encodeURIComponent(p.n);
const APPS = {
  google:{label:"Googleマップ",url:gUrl},
  yahoo:{label:"Yahoo!カーナビ",url:yUrl},
  apple:{label:"Appleマップ",url:aUrl},
  device:{label:"端末のアプリで選ぶ",url:p=>"geo:"+p.lat+","+p.lng+"?q="+p.lat+","+p.lng+"("+encodeURIComponent(p.n)+")"},
};
/* 手動追加アプリ：URLの形を1回登録すると直接起動できる
   安全のため、javascript: などの危険な形式は登録できない。値は必ずエンコードして差し込む */
const BLOCK=/^(javascript|data|vbscript|file|blob|about|chrome|intent):/i;
function validTpl(t){
  if(typeof t!=="string"||t.length>400)return false;
  const m=t.match(/^([a-z][a-z0-9+.\-]*):/i);
  if(!m||BLOCK.test(t))return false;
  return /\{(lat|lng|name)\}/.test(t);
}
function fill(t,p){return t.replace(/\{lat\}/g,String(p.lat)).replace(/\{lng\}/g,String(p.lng)).replace(/\{name\}/g,encodeURIComponent(p.n))}
function loadCustom(){
  Object.keys(APPS).filter(k=>k.startsWith("c_")).forEach(k=>delete APPS[k]);
  (S.get("tm_custom",[])||[]).forEach((c,i)=>{if(c&&validTpl(c.t)&&typeof c.n==="string")APPS["c_"+i]={label:c.n.slice(0,20),url:p=>fill(c.t,p),custom:true}});
}
loadCustom();
let mainApp = S.get("tm_app","google"); if(!APPS[mainApp]) mainApp="google";
const fmtDur = sec => {const t=Math.max(1,Math.round(sec/60)),h=Math.floor(t/60),m=t%60;return h?h+"時間"+m+"分":m+"分"};
const fmt = d => d<1 ? Math.round(d*1000)+"m" : (d<10?d.toFixed(1):Math.round(d))+"km";

let tt; function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,5000)}
function copyName(p,app){
  const t=p.f;
  const ok=()=>toast("「"+t+"」をコピーしました。"+app+"を開いて目的地に貼り付けてください。");
  try{navigator.clipboard.writeText(t).then(ok,()=>toast("コピーできませんでした。施設名："+t))}catch(e){toast("施設名："+t)}
}

function makeIcon(emo,col){
  const z=2,R=17*z,c=document.createElement("canvas");c.width=c.height=R*2+6;
  const x=c.getContext("2d"),m=c.width/2;
  x.beginPath();x.arc(m,m,R,0,Math.PI*2);x.fillStyle=col;x.fill();
  x.lineWidth=3*z;x.strokeStyle="#fff";x.stroke();
  x.font=(18*z)+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  x.textAlign="center";x.textBaseline="middle";x.fillText(emo,m,m+1*z);
  return {img:x.getImageData(0,0,c.width,c.height),z};
}

/* ---------- 無料トイレ（Overpass API・表示範囲だけ取得） ---------- */
const TOILETS=[];const tAreas=[];let tBusy=false,tTimer=null;
const OVERPASS_LIST=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
function pushToilets(){const src=map.getSource("toilet");
  if(src)src.setData({type:"FeatureCollection",features:TOILETS.map((o,k)=>({type:"Feature",properties:{k,free:o.free,n:o.n},geometry:{type:"Point",coordinates:[o.lng,o.lat]}}))})}
function setTStatus(v){tStatus=v;renderChips()}
function queueToilets(){clearTimeout(tTimer);tTimer=setTimeout(loadToilets,900)}
async function overpassQuery(q){
  let err;
  for(const url of OVERPASS_LIST){
    try{const r=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},referrerPolicy:"no-referrer"});
      if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}catch(e){err=e}
  }
  throw err;
}
let tStaticTried=false;
async function loadToilets(){
  if(!toiletsOn||tBusy)return;
  if(!tStaticTried){tStaticTried=true;tBusy=true;setTStatus("取得中…");
    const st=await staticData("toilets");tBusy=false;
    if(st&&Array.isArray(st.d)&&st.d.length){
      st.d.forEach(o=>{if(o&&typeof o.id==="string"&&isFinite(o.lat)&&isFinite(o.lng)&&!TOILETS.some(x=>x.id===o.id))
        TOILETS.push({id:o.id.slice(0,30),lat:+o.lat,lng:+o.lng,free:o.free===1?1:0,n:String(o.n||"公衆トイレ").slice(0,30),hours:String(o.hours||"").slice(0,60),wheel:String(o.wheel||"").slice(0,10),diaper:String(o.diaper||"").slice(0,10)})});
      tAreas.push(TOILET_BB.slice());}}
  const b=map.getBounds();
  let s_=b.getSouth(),w_=b.getWest(),n_=b.getNorth(),e_=b.getEast();
  const area=(n_-s_)*(e_-w_);
  if(area>0.06){setTStatus("拡大すると表示");return}
  // 取得済みの範囲に入っていれば問い合わせない
  if(tAreas.some(a=>s_>=a[0]&&w_>=a[1]&&n_<=a[2]&&e_<=a[3])){pushToilets();setTStatus(TOILETS.length+"件");return}
  const pad=0.15;const dy=(n_-s_)*pad,dx=(e_-w_)*pad;s_-=dy;n_+=dy;w_-=dx;e_+=dx;
  const bb=[s_,w_,n_,e_].map(v=>v.toFixed(4)).join(",");
  const q=`[out:json][timeout:25];(node[amenity=toilets](${bb});way[amenity=toilets](${bb}););out center tags;`;
  tBusy=true;setTStatus("取得中…");
  try{
    const j=await overpassQuery(q);
    (j.elements||[]).forEach(e=>{const o=cleanToilet(e);if(o&&!TOILETS.some(x=>x.id===o.id))TOILETS.push(o)});
    tAreas.push([s_,w_,n_,e_]);
    pushToilets();setTStatus(TOILETS.length+"件");
  }catch(e){setTStatus("取得失敗・地図を動かすと再試行")}
  finally{tBusy=false}
}

const todayStr=()=>{const d=new Date(Date.now()+9*3600*1000);return d.toISOString().slice(0,10)}; // 日本時間の日付
const tm=v=>typeof v==="string"&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v)?v:"";
function cleanEvent(o){
  if(!o||typeof o!=="object")return null;
  const str=(v,n)=>typeof v==="string"?v.replace(/[\u0000-\u001f]/g,"").trim().slice(0,n):"";
  const venue=str(o.venue,40),title=str(o.title,80);const lat=Number(o.lat),lng=Number(o.lng);
  if(!venue||!title||!isFinite(lat)||!isFinite(lng)||lat<34.5||lat>36.5||lng<138.5||lng>141)return null;
  const date=typeof o.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)?o.date:"";
  const src=typeof o.source==="string"&&/^https:\/\/[^\s"<>]{4,300}$/.test(o.source)?o.source:"";
  return {venue,title,date,open:tm(o.open),start:tm(o.start),end:tm(o.end),note:str(o.note,100),source:src,lat,lng};
}
async function loadEvents(){
  try{

const RAIL_KEY="tm_rail_v2",RAIL_TTL=30*24*3600*1000;

async function loadRail(force){

const stnVisible=s=>s.l.some(i=>!railOff.has(RAIL.lines[i].n));
function applyRail(){
  if(!map.getLayer("x-stn"))return;

  ["x-station","x-station-lb"].forEach(id=>map.setLayoutProperty(id,"visibility",LAY.station&&!has?"visible":"none"));
  ["x-stn","x-stn-lb"].forEach(id=>map.setLayoutProperty(id,"visibility",LAY.station&&has?"visible":"none"));

  if(src)src.setData({type:"FeatureCollection",features:has?RAIL.stations.map((s,k)=>({s,k})).filter(o=>stnVisible(o.s)).map(({s,k})=>{
    const L=s.l.map(i=>RAIL.lines[i]).find(l=>!railOff.has(l.n)&&l.c)||{c:"#475569"};
    return {type:"Feature",properties:{k,n:s.n,col:L.c},geometry:{type:"Point",coordinates:[s.lng,s.lat]}}}):[]});

      if(core.length>=2&&!pairs.some(p=>p[0]===core))pairs.push([core,l.c])});
    const col=["case"];pairs.slice(0,150).forEach(([core,c])=>{col.push(["in",core,["coalesce",["get","name:ja"],["get","name"],""]],c)});col.push("#64748b");

    const flt=["all",["in",["get","class"],["literal",["rail","transit"]]]];
    offCores.slice(0,150).forEach(c=>flt.push(["!",["in",c,["coalesce",["get","name:ja"],["get","name"],""]]]));
    try{map.setPaintProperty("x-rail-col","line-color",pairs.length?col:"#64748b");map.setFilter("x-rail-col",flt);map.setLayoutProperty("x-rail-col","visibility","visible")}catch(e){}

/* ---------- 路線のハイライト ---------- */
const RHL={pinned:false,station:false,key:""};
// 路線名から照合用の中心部分を取り出す（「JR山手線」→「山手」、「京王線」→「京王」）
const railCore=n=>{const b=String(n).replace(/[（(][^）)]*[）)]/g,"").trim();
  const c=b.replace(/^(JR|ＪＲ|東京メトロ|都営|東急|京王|小田急|西武|東武|京急|京成|相鉄|東京臨海高速鉄道|東京モノレール|つくばエクスプレス)\s*/,"").replace(/線$/,"").trim();
  return c.length>=2?c:b.replace(/線$/,"").trim()};
function railHL(names,pin){
  if(!map.getLayer("x-rail-hl"))return false;
  const cores=[...new Set((names||[]).map(railCore).filter(c=>c.length>=2))].slice(0,10);if(!cores.length)return false;
  const key=cores.join("|");if(key===RHL.key&&!pin)return true;RHL.key=key;
  const nm=["coalesce",["get","name:ja"],["get","name"],""];
  const flt=["all",["in",["get","class"],["literal",["rail","transit"]]],["any",...cores.map(c=>["in",c,nm])]];
  // 色：路線の色が分かればその色（複数路線なら路線ごとに色分け）
  const col=["case"];cores.forEach(c=>{const L=RAIL.lines.find(l=>railCore(l.n)===c&&l.c);col.push(["in",c,nm],L?L.c:"#f97316")});col.push("#f97316");
  try{map.setFilter("x-rail-hl-case",flt);map.setFilter("x-rail-hl",flt);map.setPaintProperty("x-rail-hl","line-color",col)}catch(e){return false}
  // 駅を停車順につないだ線も描く
  const feats=[];
  RAIL.lines.forEach(L=>{if(!cores.includes(railCore(L.n))||!Array.isArray(L.s))return;
    L.s.forEach(q=>{const cs=q.map(i=>RAIL.stations[i]).filter(Boolean).map(x=>[x.lng,x.lat]);
      if(cs.length>=2)feats.push({type:"Feature",properties:{col:L.c||"#f97316"},geometry:{type:"LineString",coordinates:cs}})})});
  const sq=map.getSource("railseq");if(sq)sq.setData({type:"FeatureCollection",features:feats});
  if(pin)RHL.pinned=true;return true;
}
function clearRailHL(force){
  if(RHL.pinned&&!force)return;RHL.pinned=false;RHL.key="";
  const NONE=["==",["get","class"],"__none__"];
  try{if(map.getLayer("x-rail-hl")){map.setFilter("x-rail-hl-case",NONE);map.setFilter("x-rail-hl",NONE)}}catch(e){}
  const sq=map.getSource("railseq");if(sq)sq.setData({type:"FeatureCollection",features:[]});
}

const TILE_CACHE="tm-tiles-v1";
const ZONE_BBOX=[139.50,35.52,139.93,35.83]; // 西,南,東,北（営業区域）
let dl={on:false,cancel:false};

const lon2x=(lon,z)=>Math.floor((lon+180)/360*2**z);
const lat2y=(lat,z)=>{const r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z)};
function tileList(bb,zmin,zmax){
  const out=[];for(let z=zmin;z<=zmax;z++){
    const x0=lon2x(bb[0],z),x1=lon2x(bb[2],z),y0=lat2y(bb[3],z),y1=lat2y(bb[1],z);
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)out.push([z,x,y])}
  return out;
}
async function tileTemplate(){

  const st=map.getStyle().sources.openmaptiles;if(st&&st.tiles&&st.tiles[0])return st.tiles[0];
  if(st&&st.url){const j=await (await fetch(st.url)).json();return j.tiles[0]}

async function addrSearch(raw){

  let s=raw.normalize("NFKC").replace(/\s+/g,"").replace(/^(東京都|神奈川県|埼玉県|千葉県|群馬県|栃木県)/,"").replace(/[ー−‐―]/g,"-");

/* ---------- 夜間モード（地図の色を暗く置き換える） ---------- */
const NIGHT_ORIG=new Map();let nightOn=false;
const COLOR_PROPS=["background-color","fill-color","fill-outline-color","line-color","text-color","text-halo-color","circle-color","circle-stroke-color","fill-extrusion-color","icon-color"];
const MY_LAYER=/^(x-|fac|area|bnd|ent|marks|route|sel|toilet|ic|event|rain|ramps|poi-|hot)/;
function parseColor(c){
  if(typeof c!=="string")return null;c=c.trim().toLowerCase();let m,r,g,b,a=1;
  if((m=c.match(/^#([0-9a-f]{3})$/))){[r,g,b]=m[1].split("").map(x=>parseInt(x+x,16))}
  else if((m=c.match(/^#([0-9a-f]{6})$/))){r=parseInt(m[1].slice(0,2),16);g=parseInt(m[1].slice(2,4),16);b=parseInt(m[1].slice(4,6),16)}
  else if((m=c.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/))){r=+m[1];g=+m[2];b=+m[3];a=m[4]!=null?+m[4]:1}
  else if((m=c.match(/^hsla?\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*(?:,\s*([\d.]+)\s*)?\)$/))){return {h:+m[1],s:+m[2]/100,l:+m[3]/100,a:m[4]!=null?+m[4]:1}}
  else if(c==="white")return {h:0,s:0,l:1,a:1};else if(c==="black")return {h:0,s:0,l:0,a:1};
  else return null;
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return {h,s,l,a};
}
const hsla=o=>"hsla("+o.h.toFixed(0)+","+(o.s*100).toFixed(0)+"%,"+(o.l*100).toFixed(0)+"%,"+o.a+")";
function nightColor(c,kind,mine){
  const o=parseColor(c);if(!o)return c;
  if(mine){ // 自分で追加した層は、白いフチ→暗いフチ、暗い文字→明るい文字だけ置き換える
    if(kind==="halo"&&o.l>0.8)return "#111827";
    if(kind==="text"&&o.l<0.4&&o.s<0.5)return "#e5e7eb";
    return c;
  }
  if(kind==="halo")return hsla({...o,l:0.08});
  if(kind==="text")return hsla({...o,s:Math.min(o.s,0.3),l:0.62+(1-o.l)*0.3});
  if(kind==="line")return hsla({...o,s:Math.min(o.s,0.35),l:0.2+o.l*0.18});
  return hsla({...o,s:Math.min(o.s,0.4),l:0.07+(1-o.l)*0.3});
}
function walkColor(v,kind,mine){
  if(typeof v==="string")return nightColor(v,kind,mine);
  if(Array.isArray(v))return v.map((x,i)=>i===0&&typeof x==="string"&&!parseColor(x)?x:walkColor(x,kind,mine));
  if(v&&typeof v==="object"&&Array.isArray(v.stops))return {...v,stops:v.stops.map(s=>[s[0],walkColor(s[1],kind,mine)])};
  return v;
}
function applyNight(){
  if(!map.getStyle())return;
  const h=new Date().getHours();const want=NIGHT_MODE==="on"||(NIGHT_MODE==="auto"&&(h>=18||h<6));
  document.documentElement.classList.toggle("night",want);
  if(want===nightOn)return;nightOn=want;
  map.getStyle().layers.forEach(l=>{
    COLOR_PROPS.forEach(prop=>{
      if(l.type!==prop.split("-")[0]&&!(prop==="background-color"&&l.type==="background"))return;
      let cur;try{cur=map.getPaintProperty(l.id,prop)}catch(e){return}
      const key=l.id+"|"+prop;
      if(want){if(cur==null)return;if(!NIGHT_ORIG.has(key))NIGHT_ORIG.set(key,cur);
        const kind=prop==="text-halo-color"?"halo":prop==="text-color"?"text":prop==="line-color"?"line":"fill";
        try{map.setPaintProperty(l.id,prop,walkColor(NIGHT_ORIG.get(key),kind,MY_LAYER.test(l.id)))}catch(e){}}
      else if(NIGHT_ORIG.has(key)){try{map.setPaintProperty(l.id,prop,NIGHT_ORIG.get(key))}catch(e){}}
    });
  });
}

      .forEach(o=>out.push({kind:"train",icon:"🚇",n:o.n+"駅",lat:o.lat,lng:o.lng,s:0.85,why:line+"：「"+msg+"」",src:x.src}))});

  let name="指定した地点（"+lat.toFixed(5)+", "+lng.toFixed(5)+"）",note="";
  try{await loadGaiku();await loadCell(cellKey(lat,lng));const b=nearestBlock(lat,lng);if(b){name=addrName(b)+"付近";note=GK_NOTE}}catch(e){}
  TMP={n:name,f:name,c:"指定地点",a:"",m:"",lat,lng,x:1,pin:true,note};
  select(TMP_I);
}
map.on("contextmenu",e=>{e.preventDefault&&e.preventDefault();pinAt(e.lngLat)});
map.on("touchstart",e=>{
  clearTimeout(lpTimer);const t=e.originalEvent&&e.originalEvent.touches;
  if(!t||t.length!==1)return;lpStart=e.point;const ll=e.lngLat;
  lpTimer=setTimeout(()=>pinAt(ll),550);
});
map.on("touchmove",e=>{if(!lpStart)return;const dx=e.point.x-lpStart.x,dy=e.point.y-lpStart.y;if(dx*dx+dy*dy>100||(e.originalEvent.touches||[]).length!==1)clearTimeout(lpTimer)});
["touchend","touchcancel","movestart","zoomstart"].forEach(ev=>map.on(ev,()=>{if(ev==="movestart"&&!lpStart)return;clearTimeout(lpTimer);if(ev!=="movestart")lpStart=null}));
try{if(!localStorage.getItem("tm_lp_tip")){setTimeout(()=>toast("ヒント：地図を長押しすると、その場所を目的地にできます。"),2500);localStorage.setItem("tm_lp_tip","1")}}catch(e){}
map.on("click",e=>{if(Date.now()-lpAt<700)return;if(addMode){startAdd(false);spotForm(null,[e.lngLat.lng,e.lngLat.lat]);return}
  const ls=["fac","toilet","ic","event","x-stn","ent","x-gaiku","marks","poi-lpg","poi-ev","poi-taxi","hot","x-rail-hit"].filter(l=>map.getLayer(l));if(ls.length&&map.queryRenderedFeatures(e.point,{layers:ls}).length)return;closeSheet()});

function showList(title,idx){
  sheet.classList.remove("min");sheet.innerHTML="";
  const h=document.createElement("div");h.className="sh";
  const t=document.createElement("h2");t.textContent=title;
  const x=document.createElement("button");x.className="x";x.type="button";x.textContent="✕";x.setAttribute("aria-label","閉じる");x.onclick=closeSheet;
  h.append(t,x);sheet.append(h);
  const list=document.createElement("div");list.className="near";
  if(!idx.length){const m=document.createElement("div");m.className="meta";m.textContent=title.includes("★")?"施設を開いて「☆ お気に入り」を押すとここに並びます。":"表示できる施設がありません。";list.append(m)}
  idx.forEach(i=>{const p=PTS[i];const b=document.createElement("button");b.type="button";
    const l=document.createElement("span");l.textContent=CAT[p.c][0]+" "+p.n;
    const r=document.createElement("b");r.textContent=me?fmt(km(me,p)):"";
    b.append(l,r);b.onclick=()=>select(i,true);list.append(b)});
  list.style.cssText="max-height:42vh;overflow:auto";
  sheet.append(list);sheet.hidden=false;
}

document.getElementById("nearBtn").onclick=()=>{
  if(!me){toast("現在地を取得しています。右上の現在地ボタンを押し、位置情報を許可してください。");geo.trigger();return}
  const idx=PTS.map((p,i)=>i).filter(i=>visibleP(PTS[i])).sort((a,b)=>km(me,PTS[a])-km(me,PTS[b])).slice(0,15);
  showList("現在地から近い施設",idx);
};

/* ---------- 検索 ---------- */
const norm=s=>s.normalize("NFKC").toLowerCase().replace(/\s+/g,"");
const q=document.getElementById("q"),res=document.getElementById("results");
q.addEventListener("input",()=>{
  const t=norm(q.value);res.innerHTML="";
  if(!t){res.hidden=true;return}
  const hit=PTS.map((p,i)=>i).filter(i=>norm(PTS[i].n+PTS[i].f+PTS[i].c+(PTS[i].a||"")).includes(t)).slice(0,20);
  hit.forEach(i=>{const p=PTS[i];const b=document.createElement("button");b.type="button";
    const e=document.createElement("span");e.textContent=CAT[p.c][0];
    const s=document.createElement("span");s.append(p.n);const sm=document.createElement("small");sm.textContent=" "+p.c+(me?" · "+fmt(km(me,p)):"");s.append(sm);
    b.append(e,s);b.onclick=()=>{res.hidden=true;q.blur();select(i,true)};res.append(b)});
  const sh=RAIL.loaded?RAIL.stations.map((s,k)=>k).filter(k=>norm(RAIL.stations[k].n+"駅").includes(t)).slice(0,8):[];
  sh.forEach(k=>{const st=RAIL.stations[k];const b=document.createElement("button");b.type="button";
    const e=document.createElement("span");e.textContent="🚉";const s2=document.createElement("span");s2.append(st.n+"駅");
    const sm=document.createElement("small");sm.textContent=" "+st.l.slice(0,3).map(i=>RAIL.lines[i].n).join("・")+(me?" · "+fmt(km(me,st)):"");s2.append(sm);
    b.append(e,s2);b.onclick=()=>{res.hidden=true;q.blur();selectStation(k);map.flyTo({center:[st.lng,st.lat],zoom:Math.max(map.getZoom(),15)})};res.append(b)});
  if(looksAddr(q.value)){const qv=q.value;loadGaiku().then(()=>addrSearch(qv)).then(ah=>{if(q.value!==qv||!ah)return;
    ah.reverse().forEach(h=>{const x=h.k!=null?GK.d[h.k]:null;const name=x?addrName(x):h.name;
      const b=document.createElement("button");b.type="button";const e=document.createElement("span");e.textContent="🏠";
      const s2=document.createElement("span");s2.append(name);const sm=document.createElement("small");sm.textContent=" 住所"+(me?" · "+fmt(km(me,x||h)):"");s2.append(sm);
      b.append(e,s2);b.onclick=()=>{res.hidden=true;q.blur();openAddr((x||h).lat,(x||h).lng,name)};res.prepend(b)});
    if(ah.length)res.hidden=false})}
  if(!hit.length&&!sh.length){const b=document.createElement("button");b.type="button";b.textContent="「"+q.value+"」をGoogleマップでナビ";
    b.onclick=()=>window.open("https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination="+encodeURIComponent(q.value),"_blank","noopener");res.append(b)}
  res.hidden=false;
});
</script>
