/* 手動追加アプリ：URLの形を1回登録すると直接起動できる
   安全のため、javascript: などの危険な形式は登録できない。値は必ずエンコードして差し込む */
const BLOCK=/^(javascript|data|vbscript|file|blob|about|chrome|intent):/i;
function validTpl(t){
  if(typeof t!=="string"||t.length>400)return false;
  const m=t.match(/^([a-z][a-z0-9+.\-]*):/i);
  if(!m||BLOCK.test(t))return false;
  return /\{(lat|lng|name)\}/.test(t);
}
function fill(t,p){return t.replace(/\{lat\}/g,String(p.lat)).replace(/\{lng\}/g,String(p.lng)).replace(/\{name\}/g,encodeURIComponent(p.n))}
function loadCustom(){
  Object.keys(APPS).filter(k=>k.startsWith("c_")).forEach(k=>delete APPS[k]);
  (S.get("tm_custom",[])||[]).forEach((c,i)=>{if(c&&validTpl(c.t)&&typeof c.n==="string")APPS["c_"+i]={label:c.n.slice(0,20),url:p=>fill(c.t,p),custom:true}});
}
loadCustom();
let mainApp = S.get("tm_app","google"); if(!APPS[mainApp]) mainApp="google";
function km(a,b){const r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 12742*Math.asin(Math.sqrt(h))}
const fmt = d => d<1 ? Math.round(d*1000)+"m" : (d<10?d.toFixed(1):Math.round(d))+"km";

let tt; function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,5000)}

}

/* ---------- 通る道（OSM経路計算） ---------- */
let lastReq=0, routeTimer=null, routeToken=0;
const ROUTE_API="https://routing.openstreetmap.de/routed-car/route/v1/driving/";
const RCACHE=new Map();
const MAJOR=/通り|通|街道|国道|バイパス|首都高|高速|自動車道|環状|大通|線$|道路/;
const SKIP=/出口|入口|ランプ|IC$|JCT$|ジャンクション|インターチェンジ/;
function roadLabel(st){return (st.name&&st.name.trim())||(st.ref&&st.ref.trim())||""}
function majorRoads(steps){
  const segs=[];
  steps.forEach(st=>{const n=roadLabel(st);const d=st.distance||0;if(!d)return;
    const last=segs[segs.length-1];if(last&&last.n===n)last.d+=d;else segs.push({n,d})});
  const keep=segs.filter(g=>g.n&&!/^[0-9A-Za-z\-\s]+$/.test(g.n)&&!SKIP.test(g.n)&&(g.d>=1000||(g.d>=600&&MAJOR.test(g.n))));
  const out=[];keep.forEach(g=>{const last=out[out.length-1];if(last&&last.n===g.n)last.d+=g.d;else out.push({...g})});
  return out;
}
const HW=/首都高|高速|自動車道/;
// 高速判定：経路データの道路分類（motorway）を優先し、なければ道路名で判定
// ルート内に道路分類の情報がある（OSRM）なら分類だけで判定、ない（Valhalla）なら道路名で判定
let CLS_MODE=false;
const hasCls=steps=>steps.some(st=>(st.intersections||[]).some(i=>i.classes&&i.classes.includes("motorway")));
const isHw=st=>CLS_MODE?(st.intersections||[]).some(i=>i.classes&&i.classes.includes("motorway")):HW.test(roadLabel(st));
const usesMotorway=rt=>{const st=(rt.legs||[]).flatMap(l=>l.steps||[]);CLS_MODE=hasCls(st);return st.some(isHw)};
const allSteps=rt=>(rt.legs||[]).flatMap(l=>l.steps||[]);
/* 首都高 普通車ETC料金の目安：（150円＋32.472円×km）×1.1、10円単位で四捨五入、300円〜上限（55km相当） */
const SHUTO={tc:150,perKm:32.472,tax:1.1,min:300,capKm:55};
function shutoToll(km){
  if(km<=0)return 0;
  const f=x=>Math.round((SHUTO.tc+SHUTO.perKm*x)*SHUTO.tax/10)*10;
  return Math.max(SHUTO.min,Math.min(f(km),f(SHUTO.capKm)));
}
function nearestRampName(pt,re){
  // 表示中の地図データから、近くにある「〜入口／〜出口」の名前を探す（500m以内）
  try{
    const fs=map.querySourceFeatures("openmaptiles",{sourceLayer:"transportation_name"});
    let best=null,bd=0.5;
    fs.forEach(f=>{const n=f.properties&&(f.properties["name:ja"]||f.properties.name);if(!n||!re.test(n))return;
      const g=f.geometry;const cs=g.type==="LineString"?g.coordinates:g.type==="MultiLineString"?g.coordinates.flat():[];
      cs.forEach(c=>{const d=km({lat:pt[1],lng:pt[0]},{lat:c[1],lng:c[0]});if(d<bd){bd=d;best=n}})});
    return best;
  }catch(e){return null}
}
/* 高速の乗り降りを「区間（ラン）」ごとに分ける。一度降りて乗り直すルートにも対応 */
function highwayInfo(rt){
  const st=allSteps(rt);CLS_MODE=hasCls(st);const idx=st.map((x,k)=>isHw(x)?k:-1).filter(k=>k>=0);
  if(!idx.length)return null;
  const runs=[];let cur=null;
  for(let k=0;k<st.length;k++){
    if(isHw(st[k])){
      if(cur&&cur.gap<700){cur.last=k;cur.gap=0}else{cur={first:k,last:k,gap:0};runs.push(cur)}
    }else if(cur){const n=roadLabel(st[k]);cur.gap+=(n&&!/入口|出口|ランプ|JCT/.test(n))?99999:(st[k].distance||0)}
  }
  const out=runs.map(r=>{
    let shutoM=0,otherM=0;
    for(let k=r.first;k<=r.last;k++){if(!isHw(st[k]))continue;if(/首都高/.test(roadLabel(st[k])))shutoM+=st[k].distance;else otherM+=st[k].distance}
    let inSt=null;for(let k=r.first-1;k>=Math.max(0,r.first-6);k--){if(/入口/.test(roadLabel(st[k]))){inSt=st[k];break}}
    let outSt=null;for(let k=r.last+1;k<=Math.min(st.length-1,r.last+6);k++){if(/出口/.test(roadLabel(st[k]))){outSt=st[k];break}}
    // 乗る位置：直前の「入口ランプ」の開始地点。降りる位置：直後の「出口ランプ」の開始地点
    let onR=null;for(let k=r.first;k>=Math.max(0,r.first-4);k--){const m=st[k].maneuver||{};if(m.type==="on ramp"){onR=st[k];break}}
    let offR=null;for(let k=r.last;k<=Math.min(st.length-1,r.last+4);k++){const m=st[k].maneuver||{};if(m.type==="off ramp"){offR=st[k];break}}
    const inPt=(onR||inSt||st[r.first]).maneuver.location;
    const ob=offR||outSt||st[Math.min(r.last+1,st.length-1)];const outPt=ob.maneuver.location;
    let prev="";for(let k=r.first-1;k>=0;k--){const n=roadLabel(st[k]);if(n&&!HW.test(n)&&!/入口|出口|ランプ/.test(n)&&!/^[0-9A-Za-z\-\s]+$/.test(n)){prev=n;break}}
    let nx="";for(let k=r.last+1;k<st.length;k++){const n=roadLabel(st[k]);if(n&&!HW.test(n)&&!/入口|出口|ランプ/.test(n)&&!/^[0-9A-Za-z\-\s]+$/.test(n)){nx=n;break}}
    return {inPt,outPt,inName:inSt?roadLabel(inSt):"",outName:outSt?roadLabel(outSt):(ob.exits?ob.exits+"出口":""),
      inFallback:prev?prev+"から乗る":"入口（名称不明）",outFallback:nx?nx+"へ降りる":"出口（名称不明）",
      shutoKm:shutoM/1000,otherKm:otherM/1000,toll:shutoToll(shutoM/1000)};
  }).filter(r=>r.shutoKm+r.otherKm>0.3);
  return {runs:out,toll:out.reduce((a,r)=>a+r.toll,0),shutoKm:out.reduce((a,r)=>a+r.shutoKm,0),otherKm:out.reduce((a,r)=>a+r.otherKm,0)};
}
/* 入口・出口名をOpenStreetMap（Overpass API）から取得。名前のない地点だけ、1ルートにつき1回問い合わせる */
const OVERPASS="https://overpass-api.de/api/interpreter";
const RAMPCACHE=new Map();
let lastOv=0;
async function fetchRampNames(pts){
  const key=pts.map(p=>p[1].toFixed(4)+","+p[0].toFixed(4)).join("|");
  if(RAMPCACHE.has(key))return RAMPCACHE.get(key);
  const wait=1100-(Date.now()-lastOv);if(wait>0)await sleep(wait);lastOv=Date.now();
  const around=pts.map(p=>`way(around:600,${p[1].toFixed(6)},${p[0].toFixed(6)})[highway=motorway_link][name];node(around:800,${p[1].toFixed(6)},${p[0].toFixed(6)})[highway=motorway_junction][name];node(around:900,${p[1].toFixed(6)},${p[0].toFixed(6)})[barrier=toll_booth][name];`).join("");
  const q=`[out:json][timeout:12];(${around});out tags center 60;`;
  const r=await fetch(OVERPASS,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},referrerPolicy:"no-referrer"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  const els=(j.elements||[]).map(e=>({n:(e.tags&&(e.tags["name:ja"]||e.tags.name))||"",link:e.type==="way",
    lat:e.lat!=null?e.lat:(e.center&&e.center.lat),lng:e.lon!=null?e.lon:(e.center&&e.center.lon)})).filter(e=>e.n&&e.lat!=null);
  RAMPCACHE.set(key,els);return els;
}
function pickRamp(els,pt,kind){
  const want=kind==="in"?/入口/:/出口/, avoid=kind==="in"?/出口/:/入口/;
  let best=null,bs=1e9;
  els.forEach(e=>{
    if(avoid.test(e.n)||/JCT|ジャンクション|本線料金所/.test(e.n))return;
    const d=km({lat:pt[1],lng:pt[0]},e);
    const score=d-(want.test(e.n)?0.3:0)-(/料金所/.test(e.n)?0.15:0);
    if(d<0.9&&score<bs){bs=score;best=e}
  });
  if(!best)return "";
  let n=best.n.replace(/\s*[\(（].*?[\)）]\s*/g,"").replace(/料金所$/,"").trim();
  if(!/入口|出口/.test(n))n+=(kind==="in"?"入口":"出口");
  return n;
}
async function enrichRamps(res){
  for(const x of res){
    if(!x.hw||x.hw.enriched)continue;
    const need=[];x.hw.runs.forEach(r=>{if(!r.inName)need.push(r.inPt);if(!r.outName)need.push(r.outPt)});
    if(need.length){
      try{const els=await fetchRampNames(need);
        x.hw.runs.forEach(r=>{if(!r.inName)r.inName=pickRamp(els,r.inPt,"in");if(!r.outName)r.outName=pickRamp(els,r.outPt,"out")});
      }catch(e){}
    }
    x.hw.runs.forEach(r=>{if(!r.inName)r.inName=r.inFallback;if(!r.outName)r.outName=r.outFallback});
    x.hw.enriched=true;
  }
}
/* 一般道ルート用：Valhalla（FOSSGIS）。高速・有料道路を避ける設定で計算し、OSRMと同じ形に変換する */
const VALHALLA="https://valhalla1.openstreetmap.de/route?json=";
function decode6(str){let i=0,lat=0,lng=0,out=[];while(i<str.length){for(const k of [0,1]){let b,sh=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const d=(r&1)?~(r>>1):(r>>1);if(k===0)lat+=d;else lng+=d}out.push([lng/1e6,lat/1e6])}return out}
async function valhallaGeneral(p){
  const wait=1100-(Date.now()-lastReq);if(wait>0)await sleep(wait);lastReq=Date.now();
  const q={locations:[{lat:+me.lat.toFixed(5),lon:+me.lng.toFixed(5)},{lat:p.lat,lon:p.lng}],costing:"auto",
    costing_options:{auto:{use_highways:0,use_tolls:0}},alternates:1,language:"ja-JP",units:"kilometers",directions_type:"maneuvers"};
  const r=await fetch(VALHALLA+encodeURIComponent(JSON.stringify(q)),{referrerPolicy:"no-referrer"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  const trips=[j.trip,...((j.alternates||[]).map(a=>a.trip))].filter(Boolean);
  return trips.map(t=>{const leg=t.legs[0];const coords=decode6(leg.shape);
    const steps=leg.maneuvers.map(m=>({name:(m.street_names||[])[0]||"",ref:"",distance:(m.length||0)*1000,maneuver:{location:coords[m.begin_shape_index]||coords[0]}}));
    return {distance:t.summary.length*1000,duration:t.summary.time,geometry:{type:"LineString",coordinates:coords},legs:[{steps}]}});
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function osrm(p,extra){
  const wait=1100-(Date.now()-lastReq);if(wait>0)await sleep(wait);
  lastReq=Date.now();
  const url=ROUTE_API+me.lng.toFixed(5)+","+me.lat.toFixed(5)+";"+p.lng.toFixed(6)+","+p.lat.toFixed(6)+"?overview=full&geometries=geojson&steps=true"+extra;
  const r=await fetch(url,{referrerPolicy:"no-referrer"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();if(j.code!=="Ok"||!j.routes||!j.routes.length)throw new Error(j.code||"no route");
  return j.routes;
}
const sameRoute=(a,b)=>Math.abs(a.distance-b.distance)<150&&Math.abs(a.duration-b.duration)<30;
function uniq(list){const out=[];list.forEach(r=>{if(!out.some(o=>sameRoute(o,r)))out.push(r)});return out}
async function getRoutes(i){
  const p=PTS[i];const key=i+"@"+me.lat.toFixed(3)+","+me.lng.toFixed(3);
  const c=RCACHE.get(key);if(c&&Date.now()-c.t<5*60*1000)return c.r;
  const a=await osrm(p,"&alternatives=3");
  let gen=[];
  try{gen=await osrm(p,"&exclude=motorway&alternatives=2")}catch(e){gen=[]}
  if(!gen.filter(r=>!usesMotorway(r)).length){try{gen=await valhallaGeneral(p)}catch(e){gen=[]}}
  gen=uniq(gen.concat(a.filter(r=>!usesMotorway(r)))).sort((x,y)=>x.distance-y.distance).slice(0,2);
  const hw=uniq(a.filter(usesMotorway)).sort((x,y)=>x.duration-y.duration).slice(0,2);
  const res=[...gen.map((rt,k)=>({grp:"一般道",label:"一般道 "+(k+1)+(k===0?"（最短）":""),rt,hw:null})),
             ...hw.map((rt,k)=>({grp:"高速",label:"高速 "+(k+1),rt,hw:highwayInfo(rt)}))];
  RCACHE.set(key,{t:Date.now(),r:res});return res;
}
function drawRoutes(res,on){
  const src=map.getSource("route");if(!src)return;
  src.setData({type:"FeatureCollection",features:res.map((x,k)=>({type:"Feature",properties:{on:k===on?1:0},geometry:x.rt.geometry}))});
  const rp=map.getSource("ramps");if(!rp)return;
  const h=res[on]&&res[on].hw;const fs=[];
  if(h)h.runs.forEach(r=>{fs.push({type:"Feature",properties:{k:"in",t:"乗 "+(r.inName||r.inFallback)},geometry:{type:"Point",coordinates:r.inPt}});
    fs.push({type:"Feature",properties:{k:"out",t:"降 "+(r.outName||r.outFallback)},geometry:{type:"Point",coordinates:r.outPt}})});
  rp.setData({type:"FeatureCollection",features:fs});
}
const yen=n=>n.toLocaleString("ja-JP")+"円";
function renderRoutes(res,box,on){
  box.innerHTML="";
  if(!res.some(x=>x.grp==="高速")){const g=document.createElement("div");g.className="note";g.textContent="高速を使うルート候補はありません（近距離など）。";box.append(g)}
  let lastGrp="";
  res.forEach((x,k)=>{
    if(x.grp!==lastGrp){lastGrp=x.grp;const g=document.createElement("div");g.className="grp";g.textContent=x.grp==="一般道"?"一般道ルート":"高速ルート";box.append(g)}
    const rt=x.rt,roads=majorRoads(allSteps(rt));
    const c=document.createElement("button");c.type="button";c.className="rc"+(k===on?" on":"");
    const t=document.createElement("div");t.className="ttl";
    t.textContent=x.label+"　約"+fmt(rt.distance/1000)+"・約"+Math.max(1,Math.round(rt.duration/60))+"分";
    const rd=document.createElement("div");rd.className="rd";
    rd.textContent=roads.length?roads.map(g=>g.n).join(" → "):"主な幹線道路は通りません（近距離）";
    c.append(t,rd);
    if(x.hw){const h=x.hw;
      h.runs.forEach(r=>{const w=document.createElement("div");w.className="hw";
        const bi=document.createElement("b");bi.className="in";bi.textContent="乗";
        const bo=document.createElement("b");bo.className="out";bo.textContent="降";
        w.append(bi,r.inName||r.inFallback,"　",bo,r.outName||r.outFallback);
        if(h.runs.length>1&&r.shutoKm>0)w.append("（首都高 約"+yen(r.toll)+"）");
        c.append(w)});
      const tl=document.createElement("div");tl.className="toll";
      tl.textContent=h.shutoKm>0?"首都高 約"+yen(h.toll)+"（普通車ETC・目安／首都高区間 約"+h.shutoKm.toFixed(1)+"km"+(h.runs.length>1?"・"+h.runs.length+"回乗車":"")+"）":"";
      if(h.otherKm>0.5)tl.textContent+=(tl.textContent?"　":"")+"＋首都高以外の高速 約"+h.otherKm.toFixed(1)+"km（料金は未計算）";
      c.append(tl)}
    c.onclick=()=>{renderRoutes(res,box,k);drawRoutes(res,k)};box.append(c);
  });
  const note=document.createElement("div");note.className="note";
  note.textContent="時間は渋滞を含まない目安です。入口・出口名はOpenStreetMapのデータから取得しています。首都高料金は2026年10月改定後の料金率（普通車32.472円/km、下限300円、上限2,130円）から計算した目安で、実際は入口・出口間の最短距離で決まります。経路：OSRM（routing.openstreetmap.de）・地図データ © OpenStreetMap contributors。";
  box.append(note);
}
function autoRoute(i,box){
  clearTimeout(routeTimer);const token=++routeToken;
  if(!me){box.innerHTML="";const m=document.createElement("div");m.className="note";m.textContent="現在地が取れると、通る道を自動で表示します。";box.append(m);return}
  const m=document.createElement("div");m.className="note";m.textContent="通る道を計算しています…";box.innerHTML="";box.append(m);
  routeTimer=setTimeout(async()=>{
    try{const res=await getRoutes(i);if(token!==routeToken||cur!==i)return;renderRoutes(res,box,0);drawRoutes(res,0);
      if(res.some(x=>x.hw&&!x.hw.enriched)){await enrichRamps(res);if(token!==routeToken||cur!==i)return;const on=Math.max(0,[...box.querySelectorAll(".rc")].findIndex(el=>el.classList.contains("on")));renderRoutes(res,box,on);drawRoutes(res,on)}}
    catch(e){if(token!==routeToken)return;box.textContent="通る道を取得できませんでした（"+e.message+"）。";}
  },800);
}
function clearRoute(){clearTimeout(routeTimer);routeToken++;const e={type:"FeatureCollection",features:[]};["route","ramps"].forEach(id=>{const src=map.getSource(id);if(src)src.setData(e)})}
function appForm(back){
  sheet.classList.remove("min");sheet.innerHTML="";
  const h=document.createElement("div");h.className="sh";const t=document.createElement("h2");t.textContent="ナビアプリを追加";
  const x=document.createElement("button");x.className="x";x.type="button";x.textContent="✕";x.setAttribute("aria-label","閉じる");x.onclick=()=>select(back);
  h.append(t,x);
  const help=document.createElement("div");help.className="meta";
  help.textContent="アプリの連携用URLを登録します。{lat}＝緯度、{lng}＝経度、{name}＝施設名に置き換わります。例：yjcarnavi://navi/select?lat={lat}&lon={lng}&name={name}";
  const f=document.createElement("form");f.style.cssText="display:flex;flex-direction:column;gap:8px";
  const n=document.createElement("input");n.id="cName";n.placeholder="表示名（例：カーナビタイム）";n.maxLength=20;n.required=true;
  const u=document.createElement("input");u.id="cTpl";u.placeholder="URLの形";u.maxLength=400;u.required=true;u.autocapitalize="off";u.spellcheck=false;
  [n,u].forEach(el=>el.style.cssText="font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px");
  const ok=document.createElement("button");ok.type="submit";ok.className="go";ok.style.border="0";ok.textContent="登録する";
  f.append(n,u,ok);
  f.onsubmit=e=>{e.preventDefault();
    if(!validTpl(u.value.trim())){toast("登録できない形式です。「アプリ名://…」の形で、{lat} {lng} {name} のどれかを含めてください。");return}
    const list=S.get("tm_custom",[]);list.push({n:n.value.trim().slice(0,20),t:u.value.trim()});S.set("tm_custom",list);
    loadCustom();toast("登録しました。");select(back)};
  const list=document.createElement("div");list.className="near";
  (S.get("tm_custom",[])||[]).forEach((c,k)=>{const b=document.createElement("button");b.type="button";
    const l=document.createElement("span");l.textContent=c.n;const r=document.createElement("b");r.textContent="削除";
    b.append(l,r);b.onclick=()=>{const L=S.get("tm_custom",[]);L.splice(k,1);S.set("tm_custom",L);loadCustom();if(!APPS[mainApp]){mainApp="google";S.set("tm_app",mainApp)}appForm(back)};list.append(b)});
  sheet.append(h,help,f,list);sheet.hidden=false;
}
function closeSheet(){sheet.classList.remove("min");sheet.hidden=true;cur=-1;setSel(-1);clearRoute()}
map.on("click",e=>{if(map.getLayer("fac")&&map.queryRenderedFeatures(e.point,{layers:["fac"]}).length)return;closeSheet()});

function showList(title,idx){
  sheet.classList.remove("min");sheet.innerHTML="";
  const h=document.createElement("div");h.className="sh";
  const t=document.createElement("h2");t.textContent=title;
  const x=document.createElement("button");x.className="x";x.type="button";x.textContent="✕";x.setAttribute("aria-label","閉じる");x.onclick=closeSheet;
  h.append(t,x);sheet.append(h);
  const list=document.createElement("div");list.className="near";
  if(!idx.length){const m=document.createElement("div");m.className="meta";m.textContent=title.includes("★")?"施設を開いて「☆ お気に入り」を押すとここに並びます。":"表示できる施設がありません。";list.append(m)}
  idx.forEach(i=>{const p=PTS[i];const b=document.createElement("button");b.type="button";
    const l=document.createElement("span");l.textContent=CAT[p.c][0]+" "+p.n;
    const r=document.createElement("b");r.textContent=me?fmt(km(me,p)):"";
    b.append(l,r);b.onclick=()=>select(i,true);list.append(b)});
  list.style.cssText="max-height:42vh;overflow:auto";
  sheet.append(list);sheet.hidden=false;
}

document.getElementById("nearBtn").onclick=()=>{
  if(!me){toast("現在地を取得しています。右上の現在地ボタンを押し、位置情報を許可してください。");geo.trigger();return}
  const idx=PTS.map((p,i)=>i).filter(i=>!off.has(PTS[i].c)).sort((a,b)=>km(me,PTS[a])-km(me,PTS[b])).slice(0,15);
  showList("現在地から近い施設",idx);
};

/* ---------- 検索 ---------- */
const norm=s=>s.normalize("NFKC").toLowerCase().replace(/\s+/g,"");
const q=document.getElementById("q"),res=document.getElementById("results");
q.addEventListener("input",()=>{
  const t=norm(q.value);res.innerHTML="";
  if(!t){res.hidden=true;return}
  const hit=PTS.map((p,i)=>i).filter(i=>norm(PTS[i].n+PTS[i].f+PTS[i].c+(PTS[i].a||"")).includes(t)).slice(0,20);
  hit.forEach(i=>{const p=PTS[i];const b=document.createElement("button");b.type="button";
    const e=document.createElement("span");e.textContent=CAT[p.c][0];
    const s=document.createElement("span");s.append(p.n);const sm=document.createElement("small");sm.textContent=" "+p.c+(me?" · "+fmt(km(me,p)):"");s.append(sm);
    b.append(e,s);b.onclick=()=>{res.hidden=true;q.blur();select(i,true)};res.append(b)});
  if(!hit.length){const b=document.createElement("button");b.type="button";b.textContent="「"+q.value+"」をGoogleマップでナビ";
    b.onclick=()=>window.open("https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination="+encodeURIComponent(q.value),"_blank","noopener");res.append(b)}
  res.hidden=false;
});
