const BLOCK=/^(javascript|data|vbscript|file|blob|about|chrome|intent):/i;
function validTpl(t){
  if(typeof t!=="string"||t.length>400)return false;
  const m=t.match(/^([a-z][a-z0-9+.\-]*):/i);
  if(!m||BLOCK.test(t))return false;
  return /\{(lat|lng|name)\}/.test(t);
}

const TOILETS=[];const tAreas=[];let tBusy=false,tTimer=null;
const OVERPASS_LIST=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
function pushToilets(){const src=map.getSource("toilet");
  if(src)src.setData({type:"FeatureCollection",features:TOILETS.map((o,k)=>({type:"Feature",properties:{k,free:o.free,n:o.n},geometry:{type:"Point",coordinates:[o.lng,o.lat]}}))})}

async function overpassQuery(q){
  let err;
  for(const url of OVERPASS_LIST){
    try{const r=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},referrerPolicy:"no-referrer"});
      if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}catch(e){err=e}
  }
  throw err;
}
async function loadToilets(){
  if(!toiletsOn||tBusy)return;
  const b=map.getBounds();
  let s_=b.getSouth(),w_=b.getWest(),n_=b.getNorth(),e_=b.getEast();
  const area=(n_-s_)*(e_-w_);
  if(area>0.06){setTStatus("拡大すると表示");return}
  // 取得済みの範囲に入っていれば問い合わせない
  if(tAreas.some(a=>s_>=a[0]&&w_>=a[1]&&n_<=a[2]&&e_<=a[3])){pushToilets();setTStatus(TOILETS.length+"件");return}
  const pad=0.15;const dy=(n_-s_)*pad,dx=(e_-w_)*pad;s_-=dy;n_+=dy;w_-=dx;e_+=dx;
  const bb=[s_,w_,n_,e_].map(v=>v.toFixed(4)).join(",");
  const q=`[out:json][timeout:25];(node[amenity=toilets](${bb});way[amenity=toilets](${bb}););out center tags;`;
  tBusy=true;setTStatus("取得中…");
  try{
    const j=await overpassQuery(q);
    (j.elements||[]).forEach(e=>{
      const t=e.tags||{};const lat=e.lat!=null?e.lat:(e.center&&e.center.lat),lng=e.lon!=null?e.lon:(e.center&&e.center.lon);if(lat==null)return;
      if(/^(private|customers|no|delivery)$/.test(t.access||""))return;
      if(t.fee==="yes"||t.charge)return;
      const id=e.type+e.id;if(TOILETS.some(o=>o.id===id))return;
      TOILETS.push({id,lat,lng,free:t.fee==="no"?1:0,n:(t["name:ja"]||t.name||"公衆トイレ").slice(0,30),
        hours:t.opening_hours||"",wheel:t.wheelchair||"",diaper:t.changing_table||t.diaper||""});
    });
    tAreas.push([s_,w_,n_,e_]);
    pushToilets();setTStatus(TOILETS.length+"件");
  }catch(e){setTStatus("取得失敗・地図を動かすと再試行")}
  finally{tBusy=false}
}

/* ---------- 通る道（一般道のみ・OSM経路計算） ---------- */
let lastReq=0, routeTimer=null, routeToken=0;
const ROUTE_API="https://routing.openstreetmap.de/routed-car/route/v1/driving/";
const VALHALLA="https://valhalla1.openstreetmap.de/route?json=";
const OVERPASS="https://overpass-api.de/api/interpreter";
const RCACHE=new Map();
const MAJOR=/通り|通|街道|国道|バイパス|環状|大通|線$|道路|道$/;
const SKIP=/出口|入口|ランプ|IC$|JCT$|ジャンクション|インターチェンジ/;
const ROADCOL=["#2563eb","#db2777","#059669","#d97706","#7c3aed","#0891b2","#dc2626","#65a30d","#c026d3","#0f766e"];
const OTHERCOL="#94a3b8";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function roadLabel(st){return (st.name&&st.name.trim())||(st.ref&&st.ref.trim())||""}
const isNum=n=>/^[0-9A-Za-z\-\s]+$/.test(n);
function majorRoads(steps){
  const segs=[];
  steps.forEach(st=>{const n=roadLabel(st);const d=st.distance||0;if(!d)return;
    const last=segs[segs.length-1];if(last&&last.n===n)last.d+=d;else segs.push({n,d})});
  const keep=segs.filter(g=>g.n&&!isNum(g.n)&&!SKIP.test(g.n)&&(g.d>=1000||(g.d>=600&&MAJOR.test(g.n))));
  const out=[];keep.forEach(g=>{const last=out[out.length-1];if(last&&last.n===g.n)last.d+=g.d;else out.push({...g})});
  return out;
}
const allSteps=rt=>(rt.legs||[]).flatMap(l=>l.steps||[]);
const sameRoute=(a,b)=>Math.abs(a.distance-b.distance)<150&&Math.abs(a.duration-b.duration)<30;
function uniq(list){const out=[];list.forEach(r=>{if(!out.some(o=>sameRoute(o,r)))out.push(r)});return out}
function decode6(str){let i=0,lat=0,lng=0,out=[];while(i<str.length){for(const k of [0,1]){let b,sh=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const d=(r&1)?~(r>>1):(r>>1);if(k===0)lat+=d;else lng+=d}out.push([lng/1e6,lat/1e6])}return out}
async function throttle(){const w=1100-(Date.now()-lastReq);if(w>0)await sleep(w);lastReq=Date.now()}
// 一般道ルート：Valhalla（高速・有料道路を避ける）。各区間の線も取り出して道路ごとに色分けに使う
async function valhallaGeneral(p){
  await throttle();
  const q={locations:[{lat:+me.lat.toFixed(5),lon:+me.lng.toFixed(5)},{lat:p.lat,lon:p.lng}],costing:"auto",
    costing_options:{auto:{use_highways:0,use_tolls:0}},alternates:2,language:"ja-JP",units:"kilometers",directions_type:"maneuvers"};
  const r=await fetch(VALHALLA+encodeURIComponent(JSON.stringify(q)),{referrerPolicy:"no-referrer"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  const trips=[j.trip,...((j.alternates||[]).map(a=>a.trip))].filter(Boolean);
  return trips.map(t=>{const leg=t.legs[0];const coords=decode6(leg.shape);
    const steps=leg.maneuvers.map(m=>({name:(m.street_names||[])[0]||"",ref:"",distance:(m.length||0)*1000,
      coords:coords.slice(m.begin_shape_index,(m.end_shape_index||m.begin_shape_index)+1)}));
    return {distance:t.summary.length*1000,duration:t.summary.time,geometry:{type:"LineString",coordinates:coords},legs:[{steps}]}});
}
// 予備：OSRM（区間の線つき）。高速を使うルートは除く
async function osrmGeneral(p){
  await throttle();
  const url=ROUTE_API+me.lng.toFixed(5)+","+me.lat.toFixed(5)+";"+p.lng.toFixed(6)+","+p.lat.toFixed(6)+"?overview=full&geometries=geojson&steps=true&alternatives=3";
  const r=await fetch(url,{referrerPolicy:"no-referrer"});if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();if(j.code!=="Ok")throw new Error(j.code);
  return (j.routes||[]).filter(rt=>!allSteps(rt).some(st=>(st.intersections||[]).some(i=>i.classes&&i.classes.includes("motorway"))))
    .map(rt=>{allSteps(rt).forEach(st=>{st.coords=st.geometry&&st.geometry.coordinates||[]});return rt});
}
async function getGeneral(p){
  let gen=[];
  try{gen=await valhallaGeneral(p)}catch(e){gen=[]}
  if(!gen.length){try{gen=await osrmGeneral(p)}catch(e){}}
  return uniq(gen).sort((x,y)=>x.distance-y.distance).slice(0,2)
    .map((rt,k)=>({label:"ルート "+(k+1)+(k===0?"（最短）":""),rt}));
}
// 主な道路に色を割り当てる（ルート内で同じ道路は同じ色）
function colorize(rt){
  const roads=majorRoads(allSteps(rt));const map_={};
  roads.forEach(g=>{if(!(g.n in map_))map_[g.n]=ROADCOL[Object.keys(map_).length%ROADCOL.length]});
  return {roads,colorOf:n=>map_[n]||OTHERCOL};
}
function drawRoutes(res,on){
  const src=map.getSource("route");if(!src)return;
  const fs=[];
  res.forEach((x,k)=>{
    if(k!==on){fs.push({type:"Feature",properties:{on:0,col:"#9ca3af"},geometry:x.rt.geometry});return}
    const {colorOf}=colorize(x.rt);
    allSteps(x.rt).forEach(st=>{if(!st.coords||st.coords.length<2)return;
      fs.push({type:"Feature",properties:{on:1,col:colorOf(roadLabel(st))},geometry:{type:"LineString",coordinates:st.coords}})});
  });
  src.setData({type:"FeatureCollection",features:fs});
}

function autoRoute(i,box){

function buildICs(els){

    const lat=e.lat!=null?e.lat:(e.center&&e.center.lat),lng=e.lon!=null?e.lon:(e.center&&e.center.lon);if(lat==null)return;
    if(/JCT|ジャンクション|本線料金所|バスストップ|PA$|SA$|パーキング/.test(n))return;
    let kind=null;
    if(/入口/.test(n))kind="in";else if(/出口/.test(n))kind="out";
    else if(t.barrier==="toll_booth")kind="in";
    else if(t.highway==="motorway_junction")kind="out";
    if(!kind)return;
    n=n.replace(/\s*[\(（].*?[\)）]\s*/g,"").replace(/(入口|出口|料金所|IC|インターチェンジ)$/,"").trim();
    if(!n)return;

    if(!same){out.push(r);return}

}

// 境界の線（way）をつないで閉じた輪にする
function ringify(ways){
  const segs=ways.map(w=>w.map(p=>[p.lon,p.lat])).filter(w=>w.length>1);const rings=[];
  const same=(a,b)=>Math.abs(a[0]-b[0])<1e-7&&Math.abs(a[1]-b[1])<1e-7;
  while(segs.length){
    let ring=segs.shift();let guard=0;
    while(!same(ring[0],ring[ring.length-1])&&guard++<5000){
      const end=ring[ring.length-1];let k=segs.findIndex(s=>same(s[0],end)||same(s[s.length-1],end));
      if(k<0)break;let sg=segs.splice(k,1)[0];if(!same(sg[0],end))sg=sg.slice().reverse();ring=ring.concat(sg.slice(1));
    }
    if(ring.length>=4&&same(ring[0],ring[ring.length-1]))rings.push(ring);
  }
  return rings;
}
function ringArea(r){let a=0;for(let i=0;i<r.length-1;i++)a+=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];return Math.abs(a/2)}
function centroid(r){let x=0,y=0,a=0;for(let i=0;i<r.length-1;i++){const f=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];x+=(r[i][0]+r[i+1][0])*f;y+=(r[i][1]+r[i+1][1])*f;a+=f}
  if(!a)return r[0];return [x/(3*a),y/(3*a)]}
function buildAreas(els){
  const out=[];
  els.forEach(e=>{
    if(e.type!=="relation")return;const n=(e.tags&&(e.tags["name:ja"]||e.tags.name))||"";const def=AREA_LIST.find(a=>a[0]===n);if(!def)return;
    const ways=(e.members||[]).filter(m=>m.type==="way"&&m.role!=="inner"&&Array.isArray(m.geometry)).map(m=>m.geometry.filter(p=>isFinite(p.lat)&&isFinite(p.lon)));
    const rings=ringify(ways).map(r=>r.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]));if(!rings.length)return;
    const big=rings.slice().sort((a,b)=>ringArea(b)-ringArea(a))[0];
    out.push({n,col:def[1],rings,c:centroid(big).map(v=>+v.toFixed(5))});
  });
  return out;
}
function drawAreas(list){
  const a=map.getSource("area"),p=map.getSource("area-pt");if(!a||!p)return;
  a.setData({type:"FeatureCollection",features:list.map(x=>({type:"Feature",properties:{n:x.n,col:x.col},geometry:{type:"MultiPolygon",coordinates:x.rings.map(r=>[r])}}))});
  p.setData({type:"FeatureCollection",features:list.map(x=>({type:"Feature",properties:{n:x.n,col:x.col},geometry:{type:"Point",coordinates:x.c}}))});
}
async function loadAreas(){
  if(AREA.loading)return;
  try{const c=S.get(AREA_KEY,null);if(c&&Date.now()-c.t<AREA_TTL&&Array.isArray(c.d)&&c.d.length){drawAreas(c.d);AREA.loaded=true;AREA.status=c.d.length+"エリア表示中";return}}catch(e){}
  AREA.loading=true;AREA.status="取得中…";
  const names=AREA_LIST.map(a=>a[0]).join("|");
  const q=`[out:json][timeout:60];rel[boundary=administrative][name~"^(${names})$"](35.60,139.50,35.78,139.82);out geom;`;
  try{const j=await overpassQuery(q);const list=buildAreas(j.elements||[]);
    if(list.length){drawAreas(list);AREA.loaded=true;AREA.status=list.length+"エリア表示中";toast(list.map(x=>x.n).join("・")+"を色分けしました。");
      const raw=JSON.stringify({t:Date.now(),d:list});if(raw.length<2500000)S.set(AREA_KEY,JSON.parse(raw))}
    else{AREA.status="境界が見つかりません";toast("エリアの境界が見つかりませんでした。")}
  }catch(e){AREA.status="取得失敗";toast("エリアの境界を取得できませんでした（"+e.message+"）。")}
  finally{AREA.loading=false}
}
function startAdd(v){
  addMode=v;map.getCanvas().style.cursor=v?"crosshair":"";renderChips();
  if(v){closeSheet();toast("追加したい場所を地図上でタップしてください。")}
}
function tempMark(pt){const src=map.getSource("sel");if(src)src.setData({type:"FeatureCollection",features:[{type:"Feature",properties:{},geometry:{type:"Point",coordinates:pt}}]})}
function spotForm(idx,pt){
  const p=idx!=null?PTS[idx]:null;let at=p?[p.lng,p.lat]:pt;
  cur=-1;clearRoute();tempMark(at);
  sheet.classList.remove("min");sheet.innerHTML="";
  const h=document.createElement("div");h.className="sh";const t=document.createElement("h2");t.textContent=p?"地点を編集":"地点を追加";
  const x=document.createElement("button");x.className="x";x.type="button";x.textContent="✕";x.setAttribute("aria-label","閉じる");x.onclick=closeSheet;h.append(t,x);
  const f=document.createElement("form");f.style.cssText="display:flex;flex-direction:column;gap:8px";
  const css="font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;box-sizing:border-box";
  const ln=document.createElement("label");ln.className="meta";ln.textContent="名前（必須）";
  const n=document.createElement("input");n.id="spName";n.maxLength=40;n.required=true;n.value=p?p.n:"";n.placeholder="例：豊玉タクシー 営業所";n.style.cssText=css;
  const lc=document.createElement("label");lc.className="meta";lc.textContent="カテゴリ";
  const c=document.createElement("select");c.id="spCat";c.style.cssText=css;
  ORDER.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=CAT[k][0]+" "+k;c.append(o)});c.value=p?p.c:"マイスポット";
  const lm=document.createElement("label");lm.className="meta";lm.textContent="メモ（任意）";
  const m=document.createElement("input");m.id="spMemo";m.maxLength=100;m.value=p?p.m||"":"";m.placeholder="例：正面入口は北側";m.style.cssText=css;
  const pos=document.createElement("div");pos.className="meta";
  const showPos=()=>{pos.textContent="位置："+at[1].toFixed(5)+", "+at[0].toFixed(5)};showPos();
  const row=document.createElement("div");row.className="alt";row.style.gridTemplateColumns="1fr 1fr";
  const here=document.createElement("button");here.type="button";here.textContent="現在地に合わせる";
  here.onclick=()=>{if(!me){toast("現在地がまだ取れていません。");return}at=[me.lng,me.lat];showPos();tempMark(at);map.flyTo({center:at,zoom:Math.max(map.getZoom(),15)})};
  const move=document.createElement("button");move.type="button";move.textContent="地図の中心に合わせる";
  move.onclick=()=>{const cc=map.getCenter();at=[cc.lng,cc.lat];showPos();tempMark(at)};
  row.append(here,move);
  const ok=document.createElement("button");ok.type="submit";ok.className="go";ok.style.border="0";ok.textContent="保存する";
  f.append(ln,n,lc,c,lm,m,pos,row,ok);
  f.onsubmit=e=>{e.preventDefault();
    const o=cleanSpot({id:p?p.id:undefined,n:n.value,c:c.value,m:m.value,lat:at[1],lng:at[0]});
    if(!o){toast("名前を入れてください。");return}
    let i2;
    if(p){Object.assign(p,toPt(o));i2=idx}else{PTS.push(toPt(o));i2=PTS.length-1}
    saveMine();refreshFac();RCACHE.clear();off.delete(o.c);S.set("tm_off",[...off]);applyFilter();renderChips();
    toast("保存しました。");select(i2);
  };
  sheet.append(h,f);sheet.style.maxHeight="78vh";sheet.style.overflow="auto";sheet.hidden=false;
  setTimeout(()=>n.focus(),50);
}
function deleteSpot(i){
  const p=PTS[i];if(!p||!p.mine)return;
  PTS.splice(i,1);saveMine();refreshFac();RCACHE.clear();closeSheet();toast("「"+p.n+"」を削除しました。");
}
function exportMine(){
  const data=PTS.filter(p=>p.mine).map(p=>({id:p.id,n:p.n,c:p.c,m:p.m,lat:p.lat,lng:p.lng}));
  if(!data.length){toast("追加した地点がありません。");return}
  const blob=new Blob([JSON.stringify({app:"taxi-map",v:1,spots:data},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="taxi-map-spots.json";
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function importMine(file){
  if(!file||file.size>500000){toast("ファイルが大きすぎます。");return}
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);const list=Array.isArray(j)?j:(j&&Array.isArray(j.spots)?j.spots:[]);
    let added=0;list.slice(0,500).map(cleanSpot).filter(Boolean).forEach(o=>{
      if(PTS.some(p=>p.mine&&(p.id===o.id||(p.n===o.n&&Math.abs(p.lat-o.lat)<1e-5&&Math.abs(p.lng-o.lng)<1e-5))))return;
      PTS.push(toPt(o));added++});
    saveMine();refreshFac();renderChips();toast(added+"件の地点を読み込みました。")}catch(e){toast("読み込めませんでした。書き出したファイルを選んでください。")}};
  r.readAsText(file);
}
function closeSheet(){sheet.classList.remove("min");sheet.hidden=true;cur=-1;setSel(-1);clearRoute()}
map.on("click",e=>{if(addMode){startAdd(false);spotForm(null,[e.lngLat.lng,e.lngLat.lat]);return}
  const ls=["fac","toilet","ic","event","x-stn"].filter(l=>map.getLayer(l));if(ls.length&&map.queryRenderedFeatures(e.point,{layers:ls}).length)return;closeSheet()});

function showList(title,idx){
  sheet.classList.remove("min");sheet.innerHTML="";
  const h=document.createElement("div");h.className="sh";
  const t=document.createElement("h2");t.textContent=title;
  const x=document.createElement("button");x.className="x";x.type="button";x.textContent="✕";x.setAttribute("aria-label","閉じる");x.onclick=closeSheet;
  h.append(t,x);sheet.append(h);
  const list=document.createElement("div");list.className="near";
  if(!idx.length){const m=document.createElement("div");m.className="meta";m.textContent=title.includes("★")?"施設を開いて「☆ お気に入り」を押すとここに並びます。":"表示できる施設がありません。";list.append(m)}
  idx.forEach(i=>{const p=PTS[i];const b=document.createElement("button");b.type="button";
    const l=document.createElement("span");l.textContent=CAT[p.c][0]+" "+p.n;
    const r=document.createElement("b");r.textContent=me?fmt(km(me,p)):"";
    b.append(l,r);b.onclick=()=>select(i,true);list.append(b)});
  list.style.cssText="max-height:42vh;overflow:auto";
  sheet.append(list);sheet.hidden=false;
}

document.getElementById("nearBtn").onclick=()=>{
  if(!me){toast("現在地を取得しています。右上の現在地ボタンを押し、位置情報を許可してください。");geo.trigger();return}
  const idx=PTS.map((p,i)=>i).filter(i=>!off.has(PTS[i].c)).sort((a,b)=>km(me,PTS[a])-km(me,PTS[b])).slice(0,15);
  showList("現在地から近い施設",idx);
};

/* ---------- 検索 ---------- */
const norm=s=>s.normalize("NFKC").toLowerCase().replace(/\s+/g,"");
const q=document.getElementById("q"),res=document.getElementById("results");
q.addEventListener("input",()=>{
  const t=norm(q.value);res.innerHTML="";
  if(!t){res.hidden=true;return}
  const hit=PTS.map((p,i)=>i).filter(i=>norm(PTS[i].n+PTS[i].f+PTS[i].c+(PTS[i].a||"")).includes(t)).slice(0,20);
  hit.forEach(i=>{const p=PTS[i];const b=document.createElement("button");b.type="button";
    const e=document.createElement("span");e.textContent=CAT[p.c][0];
    const s=document.createElement("span");s.append(p.n);const sm=document.createElement("small");sm.textContent=" "+p.c+(me?" · "+fmt(km(me,p)):"");s.append(sm);
    b.append(e,s);b.onclick=()=>{res.hidden=true;q.blur();select(i,true)};res.append(b)});
  const sh=RAIL.loaded?RAIL.stations.map((s,k)=>k).filter(k=>norm(RAIL.stations[k].n+"駅").includes(t)).slice(0,8):[];
  sh.forEach(k=>{const st=RAIL.stations[k];const b=document.createElement("button");b.type="button";
    const e=document.createElement("span");e.textContent="🚉";const s2=document.createElement("span");s2.append(st.n+"駅");
    const sm=document.createElement("small");sm.textContent=" "+st.l.slice(0,3).map(i=>RAIL.lines[i].n).join("・")+(me?" · "+fmt(km(me,st)):"");s2.append(sm);
    b.append(e,s2);b.onclick=()=>{res.hidden=true;q.blur();selectStation(k);map.flyTo({center:[st.lng,st.lat],zoom:Math.max(map.getZoom(),15)})};res.append(b)});
  if(!hit.length&&!sh.length){const b=document.createElement("button");b.type="button";b.textContent="「"+q.value+"」をGoogleマップでナビ";
    b.onclick=()=>window.open("https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination="+encodeURIComponent(q.value),"_blank","noopener");res.append(b)}
  res.hidden=false;
});
</script>
